name: Verify Life Dashboard
on:
  push:
    branches: [main, ai-nutrition-v19]
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/nutrition-ai-plan.cjs
      - run: python3 native/build_installer.py && bash -n Install-Life-Dashboard-Desktop-v12.command
      - run: unzip -t Install-Life-Dashboard-Desktop-v12.zip

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck native app
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx swiftc -swift-version 5 -sdk "$sdk" \
            -target "$(uname -m)-apple-macosx13.0" -typecheck \
            -framework Cocoa -framework WebKit -framework EventKit \
            -framework UserNotifications -framework Security native/LifeDashboard.swift
